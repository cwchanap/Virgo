name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Run Tests on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
        
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
        
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate supported Apple platforms
        run: |
          set -euo pipefail
          echo "Virgo supports macOS and iPad. iPhone targeting is intentionally disabled."

          xcodebuild -project Virgo.xcodeproj -scheme Virgo -showBuildSettings > build-settings.txt

          if ! grep -q "TARGETED_DEVICE_FAMILY = 2" build-settings.txt; then
            echo "Expected iOS-family builds to target iPad only: TARGETED_DEVICE_FAMILY = 2"
            grep "TARGETED_DEVICE_FAMILY" build-settings.txt || true
            exit 1
          fi

          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' Virgo.xcodeproj/project.pbxproj; then
            echo "Found universal iPhone+iPad targeting in project settings."
            exit 1
          fi

          if grep -q "UISupportedInterfaceOrientations_iPhone" Virgo.xcodeproj/project.pbxproj; then
            echo "Found iPhone-specific orientation settings in project settings."
            exit 1
          fi

      - name: Clean build folder
        run: xcodebuild clean -project Virgo.xcodeproj -scheme Virgo
        
      - name: Check for required assets
        run: |
          echo "Checking for ticker audio asset..."
          find . -name "ticker.*" -type f
          echo "Checking Assets.xcassets structure..."
          find ./Virgo/Assets.xcassets -type f | head -10
        
      - name: Install test formatter and result parser
        run: brew install xcbeautify xcresultparser

      - name: Generate ServerEndpoints.env from CI variables
        env:
          GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT }}
          R2_BASE_URL: ${{ vars.R2_BASE_URL }}
        run: bash .github/scripts/generate-endpoints-env.sh

      - name: Run DrumNotation package tests
        run: swift test --package-path Packages/DrumNotation --enable-code-coverage

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Virgo.xcodeproj \
            -scheme Virgo \
            -destination 'platform=macOS' \
            -configuration Debug \
            -only-testing:VirgoTests \
            -parallel-testing-enabled NO \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -destination-timeout 300 \
            -derivedDataPath ./DerivedData \
            -resultBundlePath ./DerivedData/TestResults.xcresult \
          | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./DerivedData/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 30

      - name: Export Coverage Report
        if: always()
        run: |
          set -e
          COVERAGE_DIR="$GITHUB_WORKSPACE/coverage"
          COVERAGE_REPORT="$COVERAGE_DIR/cobertura.xml"
          RESULT_BUNDLE="./DerivedData/TestResults.xcresult"

          if [ ! -e "$RESULT_BUNDLE" ]; then
            echo "No xcresult bundle found at $RESULT_BUNDLE"
            mkdir -p "$COVERAGE_DIR"
            echo "No coverage available" > "$COVERAGE_REPORT"
            exit 0
          fi

          echo "Found xcresult bundle: $RESULT_BUNDLE"

          if ! xcrun xccov view --report "$RESULT_BUNDLE" >/dev/null 2>&1; then
            echo "No coverage report available in $RESULT_BUNDLE"
            mkdir -p "$COVERAGE_DIR"
            echo "No coverage available" > "$COVERAGE_REPORT"
            exit 0
          fi

          mkdir -p "$COVERAGE_DIR"
          echo "Exporting coverage to Cobertura format..."
          xcresultparser --output-format cobertura --project-root "$GITHUB_WORKSPACE" "$RESULT_BUNDLE" > "$COVERAGE_REPORT" || true

          if [ ! -s "$COVERAGE_REPORT" ]; then
            echo "Coverage export failed or produced empty file"
            echo "No coverage available" > "$COVERAGE_REPORT"
          fi

          echo "Coverage report created at $COVERAGE_REPORT"
          ls -la "$COVERAGE_DIR"

      - name: Export Package Coverage Report
        if: always()
        run: |
          set -euo pipefail
          COVERAGE_DIR="$GITHUB_WORKSPACE/coverage"
          PACKAGE_LCOV="$COVERAGE_DIR/package.lcov"
          PKG_BUILD_DIR="$GITHUB_WORKSPACE/Packages/DrumNotation/.build"

          mkdir -p "$COVERAGE_DIR"

          # This report is required: fail closed rather than let a missing
          # upload pass silently. The SwiftPM product layout differs across
          # toolchains/build systems (<Package>PackageTests.xctest under
          # .build/debug vs <TestTarget>.xctest under .build/out/Products),
          # so discover the test bundle and coverage profile instead of
          # assuming names.
          if [ ! -d "$PKG_BUILD_DIR" ]; then
            echo "error: no package build directory at $PKG_BUILD_DIR — did the package test step run?"
            exit 1
          fi

          PROF=$(find "$PKG_BUILD_DIR" -name "*.profdata" -type f | sort | head -1)
          XCTEST_BUNDLE=$(find "$PKG_BUILD_DIR" -name "*.xctest" -type d -not -path "*/checkouts/*" | sort | head -1)
          BIN=""
          if [ -n "$XCTEST_BUNDLE" ]; then
            BIN=$(find "$XCTEST_BUNDLE" -path "*/Contents/MacOS/*" -type f | sort | head -1)
          fi

          if [ -z "$PROF" ] || [ -z "$BIN" ]; then
            echo "error: package coverage inputs not found under $PKG_BUILD_DIR"
            echo "profdata: ${PROF:-<none>}"
            echo "xctest bundle: ${XCTEST_BUNDLE:-<none>}"
            echo "test binary: ${BIN:-<none>}"
            echo "candidates under $PKG_BUILD_DIR:"
            find "$PKG_BUILD_DIR" \( -name "*.profdata" -o -name "*.xctest" \) | sort || true
            exit 1
          fi

          echo "Exporting package coverage to lcov format..."
          echo "profdata: $PROF"
          echo "test binary: $BIN"

          # Relativize SF paths to the repo root and drop non-source records
          # (test files and .build derived sources are not production code).
          xcrun llvm-cov export -format=lcov -instr-profile "$PROF" "$BIN" \
            | sed "s|^SF:$GITHUB_WORKSPACE/|SF:|" \
            | awk '/^SF:/ { skip = ($0 ~ /\.build\// || $0 ~ /\/Tests\//) } !skip { print }' \
            > "$PACKAGE_LCOV"

          if [ ! -s "$PACKAGE_LCOV" ]; then
            echo "error: package coverage export produced empty file"
            rm -f "$PACKAGE_LCOV"
            exit 1
          fi

          echo "Package coverage report created at $PACKAGE_LCOV"
          head -5 "$PACKAGE_LCOV"

      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: coverage
          if-no-files-found: warn
            

  build-archive:
    name: Test Archive Build (macOS)
    runs-on: macos-latest
    needs: [test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Generate ServerEndpoints.env from CI variables
        env:
          GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT }}
          R2_BASE_URL: ${{ vars.R2_BASE_URL }}
        run: bash .github/scripts/generate-endpoints-env.sh

      - name: Test archive build for macOS
        run: |
          xcodebuild archive \
            -project Virgo.xcodeproj \
            -scheme Virgo \
            -destination 'generic/platform=macOS' \
            -archivePath ./build/Virgo-macOS.xcarchive \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates

  build-ios:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Build (iPad Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Generate ServerEndpoints.env from CI variables
        env:
          GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT }}
          R2_BASE_URL: ${{ vars.R2_BASE_URL }}
        run: bash .github/scripts/generate-endpoints-env.sh

      - name: Build for iPad Simulator
        run: |
          xcodebuild build \
            -project Virgo.xcodeproj \
            -scheme Virgo \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  codecov:
    name: Upload Coverage to Codecov
    runs-on: macos-latest
    needs: test
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}

    steps:
      - name: Checkout coverage commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Download coverage results
        uses: actions/download-artifact@v4
        with:
          name: coverage-results
          path: coverage-results

      - name: Validate coverage report
        id: validate
        run: |
          set -euo pipefail
          report="coverage-results/cobertura.xml"

          if [ ! -s "$report" ]; then
            echo "Coverage report is missing or empty — skipping upload"
            echo "skip_upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q '^No coverage available$' "$report"; then
            echo "Coverage report is the 'No coverage available' sentinel — skipping upload"
            echo "skip_upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! xmllint --noout "$report"; then
            echo "Coverage report is not valid XML"
            exit 1
          fi

          if ! grep -Eq '<coverage([[:space:]>])' "$report"; then
            echo "Coverage report does not contain a Cobertura <coverage> root"
            exit 1
          fi

          echo "Coverage report is valid:"
          head -20 "$report"

      - name: Validate package coverage report
        run: |
          set -euo pipefail
          pkg_report="coverage-results/package.lcov"

          # The package report is required: a missing or empty upload must
          # fail rather than skip, or the package coverage gate is inert.
          if [ ! -s "$pkg_report" ]; then
            echo "Package coverage report is missing or empty"
            ls -la coverage-results || true
            exit 1
          fi

          if ! grep -q '^SF:' "$pkg_report"; then
            echo "Package coverage report has no lcov SF records"
            exit 1
          fi

          echo "Package coverage report is valid:"
          head -5 "$pkg_report"

      - name: Upload coverage to Codecov
        if: steps.validate.outputs.skip_upload != 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage-results/cobertura.xml
          flags: unit-tests
          disable_search: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload package coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage-results/package.lcov
          flags: package-tests
          disable_search: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
