coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 95%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 95%
        threshold: 0%
        informational: false

ignore:
  - "**/*.generated.swift"
  - "**/DerivedData/**"
  - "**/build/**"
  - "VirgoTests"
  - "VirgoUITests"
  - "**/*.xctest/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: yes
  require_head: yes

flags:
  unit-tests:
    carryforward: false
  ui-tests:
    carryforward: false
